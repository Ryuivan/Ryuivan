<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 38px; fill: #f8fafc; }
    .role { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 16px; fill: #94a3b8; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #38bdf8; letter-spacing: 2px; text-transform: uppercase; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 11px; fill: #cbd5e1; }
    .dot { fill: #10b981; }
  </style>

  <!-- Background Card -->
  <rect width="896" height="216" x="2" y="2" rx="12" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  
  <!-- Subtle Grid Pattern -->
  <rect width="896" height="216" x="2" y="2" rx="12" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <rect x="2" y="2" width="896" height="4" rx="2" fill="url(#accent-grad)" />

  <!-- Content Elements -->
  <g transform="translate(48, 48)">
    <!-- Subtitle Tag -->
    <text x="0" y="20" class="tag">Software Engineering &amp; System Architecture</text>
    
    <!-- Main Name Heading -->
    <text x="0" y="68" class="name">Ryu Ivan Wijaya</text>
    
    <!-- Role Sub-heading -->
    <text x="0" y="102" class="role">Software Engineer  •  Full-Stack &amp; Backend Developer</text>

    <!-- Status Chip -->
    <g transform="translate(0, 124)">
      <rect width="270" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <circle cx="14" cy="13" r="4" class="dot" />
      <text x="26" y="17" class="badge-text">Available for Software Engineering Roles</text>
    </g>
  </g>

  <!-- Decorative Modern Right Geometric Glow -->
  <g transform="translate(730, 40)" opacity="0.85">
    <circle cx="60" cy="60" r="70" fill="#0284c7" opacity="0.12" filter="blur(20px)" />
    <rect x="15" y="15" width="90" height="90" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <path d="M 35 45 L 50 60 L 35 75 M 65 75 L 80 75" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
